[workspace]
resolver = "2"
members = ["src-tauri"]
exclude = ["runner-template"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/JohnLyonX/tokioscope"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
dirs = "5"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TokioScope">
  <defs>
    <filter id="ts-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- dark "scope screen" -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1A1D22" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#2A2F37" />
  <!-- scope baseline -->
  <line x1="11" y1="46" x2="53" y2="46" stroke="#2E333B" stroke-width="1.4" stroke-linecap="round" />
  <!-- orange tick / step waveform (the scheduler trace, tick by tick) -->
  <path d="M11 40 H19 V25 H29 V40 H37 V25 H47 V40 H53"
        fill="none" stroke="#E0843A" stroke-width="4.2"
        stroke-linejoin="round" stroke-linecap="round" filter="url(#ts-glow)" />
</svg>

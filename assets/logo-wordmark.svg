<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" width="340" height="88" role="img" aria-label="tokioscope">
  <defs>
    <filter id="ts-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- self-contained dark card so it reads on any README background -->
  <rect width="340" height="88" rx="18" fill="#1A1D22" />
  <!-- waveform glyph (the card itself is the "screen") -->
  <g transform="translate(20,17) scale(0.78)">
    <line x1="11" y1="46" x2="53" y2="46" stroke="#2E333B" stroke-width="1.7" stroke-linecap="round" />
    <path d="M11 40 H19 V25 H29 V40 H37 V25 H47 V40 H53"
          fill="none" stroke="#E0843A" stroke-width="4.4"
          stroke-linejoin="round" stroke-linecap="round" filter="url(#ts-glow)" />
  </g>
  <text x="96" y="56" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
        font-size="34" font-weight="600" letter-spacing="-1.5">
    <tspan fill="#C9D3DF">tokio</tspan><tspan fill="#E0843A">scope</tspan>
  </text>
</svg>

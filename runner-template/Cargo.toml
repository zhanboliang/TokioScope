[package]
name = "tokioscope-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full", "test-util", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 1
debug = false
incremental = true
codegen-units = 16
lto = false
